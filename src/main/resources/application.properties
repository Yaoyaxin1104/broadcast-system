server.port=8089
server.servlet.context-path=/api

# 激活开发环境配置（application-dev.yml：Druid 连接池 + 监控）
spring.profiles.active=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/broadcast_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.grbroadcast.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Redis 配置：缓存登录用户完整信息
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=10000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=4
spring.redis.lettuce.pool.min-idle=0

file.upload-path=F:/upload/

# JWT 配置
jwt.secret=grbroadcast-secret-key-2026-cw3104-very-long
jwt.expire=3600