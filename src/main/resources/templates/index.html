<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广软广播站点歌投稿系统 - 后台管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .user-info button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 5px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    .sidebar {
      width: 200px;
      background: white;
      height: calc(100vh - 70px);
      float: left;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
      overflow-y: auto;
    }
    .sidebar-item {
      padding: 15px 20px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.3s;
    }
    .sidebar-item:hover {
      background: #f5f7fa;
      color: #667eea;
    }
    .sidebar-item.active {
      background: #f5f7fa;
      color: #667eea;
      border-right: 3px solid #667eea;
    }
    .main {
      margin-left: 200px;
      padding: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }
    .stat-label {
      color: #999;
      margin-top: 8px;
    }
    .content-area {
      background: white;
      border-radius: 8px;
      padding: 20px;
      min-height: 400px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .clearfix::after {
      content: "";
      display: table;
      clear: both;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f8f9fa;
    }
    .status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
    }
    .status-pending {
      background: #fff3cd;
      color: #856404;
    }
    .status-approved {
      background: #d4edda;
      color: #155724;
    }
    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }
    .btn {
      padding: 5px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-success {
      background: #28a745;
      color: white;
    }
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-warning {
      background: #ffc107;
      color: #333;
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      margin: 2px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }
    .menu-card {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    .menu-card .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    .menu-card .name {
      font-size: 16px;
      font-weight: bold;
    }
    .error-msg {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin: 20px;
    }
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 8px;
      color: white;
      z-index: 9999;
      animation: slideIn 0.3s;
    }
    .toast-success {
      background: #28a745;
    }
    .toast-error {
      background: #dc3545;
    }
    .toast-info {
      background: #667eea;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .search-box {
      margin: 10px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box input,
    .search-box select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .search-box input:focus,
    .search-box select:focus {
      outline: none;
      border-color: #667eea;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      min-width: 400px;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .modal-box h3 {
      margin-bottom: 20px;
      color: #333;
    }
    .modal-box .form-group {
      margin-bottom: 15px;
    }
    .modal-box .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    .modal-box .form-group input,
    .modal-box .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .modal-box .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
    .modal-box .btn-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .btn-cancel {
      background: #6c757d;
      color: white;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">🎙️ 广软广播站</div>
    <div class="user-info">
      <span id="userName">未登录</span>
      <button onclick="logout()">退出</button>
    </div>
  </div>
  <div class="clearfix">
    <div class="sidebar">
      <div class="sidebar-item active" onclick="loadHome()">🏠 首页</div>
      <div class="sidebar-item" onclick="loadSongs()">🎵 点歌管理</div>
      <div class="sidebar-item" onclick="loadArticles()">📝 稿件管理</div>
      <div class="sidebar-item" onclick="loadPrograms()">📅 节目单</div>
      <div class="sidebar-item" onclick="loadMessages()">💬 留言管理</div>
      <div class="sidebar-item" onclick="location.href='pages/uploadAudio.html'">🎧 音频管理</div>
    </div>
    <div class="main">
      <div id="contentArea" class="content-area">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>
</div>
<div id="toastContainer"></div>
<script>
  // ==================== 配置 ====================
  const API_BASE = 'http://localhost:8089/api';
  let currentUser = null;
  // ==================== Toast ====================
  function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
  }
  // ==================== 初始化 ====================
  document.addEventListener('DOMContentLoaded', function() {
    checkLogin();
  });
  // ==================== 登录检查 ====================
  function checkLogin() {
    const userStr = localStorage.getItem('currentUser');
    if (userStr) {
      try {
        currentUser = JSON.parse(userStr);
        document.getElementById('userName').textContent =
                (currentUser.role === 'student' ? '学生' : '广播站') +
                '：' + (currentUser.realName || currentUser.username);
        loadHome();
        return;
      } catch (e) {
        console.error('解析用户信息失败', e);
      }
    }
    window.location.href = 'login.html';
  }
  // ==================== 退出登录 ====================
  function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
  }
  // ==================== 1. 加载首页 ====================
  function loadHome() {
    document.getElementById('contentArea').innerHTML = `
                <h2>📊 数据统计</h2>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="statSong">0</div><div class="stat-label">点歌总数</div></div>
                    <div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">待审核</div></div>
                    <div class="stat-card"><div class="stat-number" id="statArticle">0</div><div class="stat-label">稿件总数</div></div>
                    <div class="stat-card"><div class="stat-number" id="statMessage">0</div><div class="stat-label">留言总数</div></div>
                </div>
                <div class="menu-grid">
                    <div class="menu-card" onclick="loadSongs()"><div class="icon">🎵</div><div class="name">点歌管理</div></div>
                    <div class="menu-card" onclick="loadArticles()"><div class="icon">📝</div><div class="name">稿件管理</div></div>
                    <div class="menu-card" onclick="loadPrograms()"><div class="icon">📅</div><div class="name">节目单</div></div>
                    <div class="menu-card" onclick="loadMessages()"><div class="icon">💬</div><div class="name">留言管理</div></div>
                    <div class="menu-card" onclick="location.href='pages/uploadAudio.html'"><div class="icon">🎧</div><div class="name">音频管理</div></div>
                </div>
            `;
    loadStats();
  }
  // ==================== 加载统计数据 ====================
  function loadStats() {
    fetch(API_BASE + '/song/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                const songs = data.data || [];
                document.getElementById('statSong').textContent = songs.length;
                document.getElementById('statPending').textContent = songs.filter(s => s.status === 'pending').length;
              }
            }).catch(err => console.error(err));
    fetch(API_BASE + '/article/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                document.getElementById('statArticle').textContent = (data.data || []).length;
              }
            }).catch(err => console.error(err));
    fetch(API_BASE + '/message/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                document.getElementById('statMessage').textContent = (data.data || []).length;
              }
            }).catch(err => console.error(err));
  }
  // ==================== 2. 点歌管理 ====================
  function loadSongs() {
    document.getElementById('contentArea').innerHTML = `
        <h2>🎵 点歌管理</h2>
        <div class="search-box">
            <input type="text" id="searchKeyword" placeholder="搜索歌曲名或歌手" style="flex:1;min-width:200px;">
            <select id="searchStatus">
                <option value="">全部状态</option>
                <option value="pending">待审核</option>
                <option value="approved">已通过</option>
                <option value="rejected">已拒绝</option>
            </select>
            <button class="btn btn-primary" onclick="searchSongs()">🔍 搜索</button>
            <button class="btn btn-primary" onclick="loadSongs()">🔄 刷新</button>
        </div>
        <div id="songTable">加载中...</div>
    `;

    fetch(API_BASE + '/song/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderSongTable(data.data || []);
              } else {
                document.getElementById('songTable').innerHTML = '<p style="color:red;">加载失败</p>';
              }
            })
            .catch(err => {
              document.getElementById('songTable').innerHTML = '<p style="color:red;">请求失败，请检查后端服务</p>';
              console.error(err);
            });
  }
  // ==================== 渲染点歌表格 ====================
  function renderSongTable(songs) {
    if (!songs || songs.length === 0) {
      document.getElementById('songTable').innerHTML = '<p style="color:#999;">暂无点歌记录</p>';
      return;
    }
    const statusMap = {
      'pending': '<span class="status status-pending">待审核</span>',
      'approved': '<span class="status status-approved">已通过</span>',
      'rejected': '<span class="status status-rejected">已拒绝</span>'
    };
    let html = `<p style="color:#999;">共 ${songs.length} 条记录</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>歌曲</th>
                                    <th>歌手</th>
                                    <th>申请人</th>
                                    <th>状态</th>
                                    <th>申请时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>`;
    songs.forEach(s => {
      html += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.song_name || s.songName}</td>
                        <td>${s.singer}</td>
                        <td>${s.student_name || '未知'}</td>
                        <td>${statusMap[s.status] || s.status}</td>
                        <td>${s.create_time || s.createTime}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openEditSong(${s.id})">✏️ 修改</button>
                            <button class="btn btn-success btn-sm" onclick="auditSong(${s.id}, 'approved')">通过</button>
                            <button class="btn btn-danger btn-sm" onclick="auditSong(${s.id}, 'rejected')">拒绝</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteSong(${s.id})">删除</button>
                        </td>
                    </tr>
                `;
    });
    html += `</tbody></table>`;
    document.getElementById('songTable').innerHTML = html;
  }

  // ==================== 搜索点歌 ====================
  function searchSongs() {
    const keyword = document.getElementById('searchKeyword').value;
    const status = document.getElementById('searchStatus').value;

    let url = API_BASE + '/song/search?';
    let params = [];
    if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
    if (status) params.push('status=' + status);
    url += params.join('&');

    fetch(url)
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderSongTable(data.data || []);
              } else {
                document.getElementById('songTable').innerHTML = '<p style="color:red;">搜索失败</p>';
              }
            })
            .catch(err => {
              document.getElementById('songTable').innerHTML = '<p style="color:red;">请求失败</p>';
              console.error(err);
            });
  }
  // ==================== 打开修改弹窗 ====================
  function openEditSong(id) {
    // 先获取点歌详情
    fetch(API_BASE + '/song/detail/' + id)
            .then(res => res.json())
            .then(data => {
              if (data.code === 200 && data.data) {
                const s = data.data;
                showEditModal(id, s.song_name || s.songName, s.singer, s.message || '');
              } else {
                showToast('获取数据失败', 'error');
              }
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  // ==================== 显示修改弹窗 ====================
  function showEditModal(id, songName, singer, message) {
    // 移除已有弹窗
    const oldModal = document.querySelector('.modal-overlay');
    if (oldModal) oldModal.remove();

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
                <div class="modal-box">
                    <h3>✏️ 修改点歌</h3>
                    <div class="form-group">
                        <label>歌曲名称</label>
                        <input type="text" id="editSongName" value="${songName}">
                    </div>
                    <div class="form-group">
                        <label>歌手</label>
                        <input type="text" id="editSinger" value="${singer}">
                    </div>
                    <div class="form-group">
                        <label>留言</label>
                        <textarea id="editMessage">${message}</textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="btn btn-primary" onclick="saveEditSong(${id})">保存修改</button>
                    </div>
                </div>
            `;
    document.body.appendChild(modal);

    // 点击背景关闭
    modal.addEventListener('click', function(e) {
      if (e.target === this) this.remove();
    });
  }

  // ==================== 保存修改 ====================
  function saveEditSong(id) {
    const songName = document.getElementById('editSongName').value;
    const singer = document.getElementById('editSinger').value;
    const message = document.getElementById('editMessage').value;

    if (!songName || !singer) {
      showToast('歌曲名称和歌手不能为空', 'error');
      return;
    }

    fetch(API_BASE + '/song/update', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: id,
        songName: songName,
        singer: singer,
        message: message
      })
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '修改成功', data.code === 200 ? 'success' : 'error');
              if (data.code === 200) {
                // 关闭弹窗
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
                loadSongs();
              }
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  // ==================== 审核点歌 ====================
  function auditSong(id, status) {
    if (!confirm('确认审核该点歌吗？')) return;

    const userStr = localStorage.getItem('currentUser');
    if (!userStr) {
      showToast('请先登录', 'error');
      return;
    }
    const user = JSON.parse(userStr);

    //向后端发送请求
    fetch(API_BASE + '/song/audit/' + id + '?status=' + status + '&userId=' + user.id, {
      method: 'PUT'
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '操作成功', data.code === 200 ? 'success' : 'error');
              if (data.code === 200) loadSongs();
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }
  // ==================== 删除点歌 ====================
  function deleteSong(id) {
    if (!confirm('确认删除该点歌记录吗？')) return;
    fetch(API_BASE + '/song/delete/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '删除成功', 'success');
              if (data.code === 200) loadSongs();
            })
            .catch(err => { showToast('请求失败', 'error');
              console.error(err); });
  }

  // ==================== 3. 稿件管理 ====================
  function loadArticles() {
    document.getElementById('contentArea').innerHTML = `
                <h2>📝 稿件管理</h2>
                <div class="search-box">
                    <input type="text" id="searchArticleTitle" placeholder="搜索标题">
                    <select id="searchArticleStatus">
                        <option value="">全部状态</option>
                        <option value="pending">待审核</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                    </select>
                    <button class="btn btn-primary" onclick="searchArticles()">🔍 搜索</button>
                    <button class="btn btn-primary" onclick="loadArticles()">🔄 刷新</button>
                </div>
                <div id="articleTable">加载中...</div>
            `;

    fetch(API_BASE + '/article/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderArticleTable(data.data || []);
              }
            })
            .catch(function(err) {
              document.getElementById('articleTable').innerHTML = '<p style="color:red;">请求失败</p>';
              console.error(err);
            });
  }

  function renderArticleTable(articles) {
    if (!articles || articles.length === 0) {
      document.getElementById('articleTable').innerHTML = '<p style="color:#999;">暂无稿件</p>';
      return;
    }
    const statusMap = {
      'pending': '<span class="status status-pending">待审核</span>',
      'approved': '<span class="status status-approved">已通过</span>',
      'rejected': '<span class="status status-rejected">已拒绝</span>'
    };
    const typeMap = {
      'news': '新闻稿',
      'story': '故事随笔',
      'poem': '诗歌散文'
    };
    let html = `<p style="color:#999;">共 ${articles.length} 条记录</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>标题</th>
                                    <th>类型</th>
                                    <th>状态</th>
                                    <th>投稿时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>`;
    articles.forEach(function(a) {
      html += `
                    <tr>
                        <td>${a.id}</td>
                        <td>${a.title}</td>
                        <td>${typeMap[a.type] || a.type}</td>
                        <td>${statusMap[a.status] || a.status}</td>
                        <td>${a.create_time || a.createTime}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openEditArticle(${a.id})">✏️ 修改</button>
                            <button class="btn btn-success btn-sm" onclick="auditArticle(${a.id}, 'approved')">通过</button>
                            <button class="btn btn-danger btn-sm" onclick="auditArticle(${a.id}, 'rejected')">拒绝</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteArticle(${a.id})">删除</button>
                        </td>
                    </tr>
                `;
    });
    html += `</tbody></table>`;
    document.getElementById('articleTable').innerHTML = html;
  }

  function searchArticles() {
    const title = document.getElementById('searchArticleTitle').value;
    const status = document.getElementById('searchArticleStatus').value;
    let url = API_BASE + '/article/search?';
    let params = [];
    if (title) params.push('title=' + encodeURIComponent(title));
    if (status) params.push('status=' + status);
    url += params.join('&');

    fetch(url)
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderArticleTable(data.data || []);
              }
            })
            .catch(err => {
              document.getElementById('articleTable').innerHTML = '<p style="color:red;">搜索失败</p>';
              console.error(err);
            });
  }

  function openEditArticle(id) {
    fetch(API_BASE + '/article/detail/' + id)
            .then(res => res.json())
            .then(data => {
              if (data.code === 200 && data.data) {
                const a = data.data;
                showArticleEditModal(id, a.title, a.type, a.content || '');
              } else {
                showToast('获取数据失败', 'error');
              }
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  function showArticleEditModal(id, title, type, content) {
    const oldModal = document.querySelector('.modal-overlay');
    if (oldModal) oldModal.remove();

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
                <div class="modal-box">
                    <h3>✏️ 修改稿件</h3>
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" id="editArticleTitle" value="${title}">
                    </div>
                    <div class="form-group">
                        <label>类型</label>
                        <select id="editArticleType">
                            <option value="news" ${type === 'news' ? 'selected' : ''}>新闻稿</option>
                            <option value="story" ${type === 'story' ? 'selected' : ''}>故事随笔</option>
                            <option value="poem" ${type === 'poem' ? 'selected' : ''}>诗歌散文</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="editArticleContent">${content}</textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="btn btn-primary" onclick="saveEditArticle(${id})">保存修改</button>
                    </div>
                </div>
            `;
    document.body.appendChild(modal);

    modal.addEventListener('click', function(e) {
      if (e.target === this) this.remove();
    });
  }

  function saveEditArticle(id) {
    const title = document.getElementById('editArticleTitle').value;
    const type = document.getElementById('editArticleType').value;
    const content = document.getElementById('editArticleContent').value;

    if (!title || !content) {
      showToast('标题和内容不能为空', 'error');
      return;
    }

    fetch(API_BASE + '/article/update', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, title: title, type: type, content: content })
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '修改成功', data.code === 200 ? 'success' : 'error');
              if (data.code === 200) {
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
                loadArticles();
              }
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  function auditArticle(id, status) {
    if (!confirm('确认审核该稿件吗？')) return;

    const userStr = localStorage.getItem('currentUser');
    if (!userStr) {
      showToast('请先登录', 'error');
      return;
    }
    const user = JSON.parse(userStr);

    fetch(API_BASE + '/article/audit/' + id + '?status=' + status + '&userId=' + user.id, {
      method: 'PUT'
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '操作成功', data.code === 200 ? 'success' : 'error');
              if (data.code === 200) loadArticles();
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  function deleteArticle(id) {
    if (!confirm('确认删除该稿件吗？')) return;
    fetch(API_BASE + '/article/delete/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '删除成功', 'success');
              if (data.code === 200) loadArticles();
            })
            .catch(function(err) {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  // ==================== 4. 节目单 ====================
  function loadPrograms() {
    document.getElementById('contentArea').innerHTML = `
                <h2>📅 节目单管理</h2>
                <div class="search-box">
                    <input type="text" id="searchProgramName" placeholder="搜索节目名称">
                    <input type="date" id="searchProgramDate">
                    <button class="btn btn-primary" onclick="searchPrograms()">🔍 搜索</button>
                    <button class="btn btn-primary" onclick="loadPrograms()">🔄 刷新</button>
                    <button class="btn btn-success" onclick="openAddProgram()">➕ 发布节目</button>
                </div>
                <div id="programTable">加载中...</div>
            `;

    fetch(API_BASE + '/program/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderProgramTable(data.data || []);
              }
            })
            .catch(err => {
              document.getElementById('programTable').innerHTML = '<p style="color:red;">请求失败</p>';
              console.error(err);
            });
  }

  function renderProgramTable(programs) {
    if (!programs || programs.length === 0) {
      document.getElementById('programTable').innerHTML = '<p style="color:#999;">暂无节目单</p>';
      return;
    }
    let html = `<p style="color:#999;">共 ${programs.length} 条记录</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>节目名称</th>
                                    <th>日期</th>
                                    <th>时间段</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>`;
    programs.forEach(p => {
      html += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.program_name || p.programName}</td>
                        <td>${p.date}</td>
                        <td>${p.time_slot || p.timeSlot}</td>
                        <td><span class="status status-approved">已发布</span></td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openEditProgram(${p.id})">✏️ 修改</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteProgram(${p.id})">删除</button>
                        </td>
                    </tr>
                `;
    });
    html += `</tbody></table>`;
    document.getElementById('programTable').innerHTML = html;
  }

  function searchPrograms() {
    const name = document.getElementById('searchProgramName').value;
    const date = document.getElementById('searchProgramDate').value;
    let url = API_BASE + '/program/search?';
    let params = [];
    if (name) params.push('programName=' + encodeURIComponent(name));
    if (date) params.push('date=' + date);
    url += params.join('&');

    fetch(url)
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderProgramTable(data.data || []);
              }
            })
            .catch(err => {
              document.getElementById('programTable').innerHTML = '<p style="color:red;">搜索失败</p>';
              console.error(err);
            });
  }

  function openAddProgram() {
    const oldModal = document.querySelector('.modal-overlay');
    if (oldModal) oldModal.remove();

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-box">
            <h3>📅 发布节目</h3>
            <div class="form-group">
                <label>节目名称</label>
                <input type="text" id="addProgramName" placeholder="请输入节目名称">
            </div>
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="addProgramDate">
            </div>
            <div class="form-group">
                <label>时间段</label>
                <input type="text" id="addProgramTime" placeholder="如：12:00-12:30">
            </div>
            <div class="form-group">
                <label>内容</label>
                <textarea id="addProgramContent" placeholder="请输入节目内容"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                <button class="btn btn-primary" onclick="saveAddProgram()">发布</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    modal.addEventListener('click', function(e) {
      if (e.target === this) this.remove();
    });
  }

  function saveAddProgram() {
    const programName = document.getElementById('addProgramName').value;
    const date = document.getElementById('addProgramDate').value;
    const timeSlot = document.getElementById('addProgramTime').value;
    const content = document.getElementById('addProgramContent').value;

    if (!programName || !date || !timeSlot) {
      showToast('请填写完整信息', 'error');
      return;
    }

    const userStr = localStorage.getItem('currentUser');
    if (!userStr) {
      showToast('请先登录', 'error');
      return;
    }
    const user = JSON.parse(userStr);

    // 拼接 URL，带上 userId 参数
    const url = API_BASE + '/program/publish?userId=' + user.id;

    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        programName: programName,
        date: date,
        timeSlot: timeSlot,
        content: content,
        status: 'published'
      })
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '发布成功', data.code === 200 ? 'success' : 'error');
              if (data.code === 200) {
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
                loadPrograms();
              }
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  function openEditProgram(id) {
    fetch(API_BASE + '/program/detail/' + id)
            .then(res => res.json())
            .then(data => {
              if (data.code === 200 && data.data) {
                const p = data.data;
                showProgramEditModal(id, p.program_name || p.programName, p.date, p.time_slot || p.timeSlot, p.content || '');
              }
            })
            .catch(err => {
              showToast('获取数据失败', 'error');
              console.error(err);
            });
  }

  function showProgramEditModal(id, name, date, timeSlot, content) {
    const oldModal = document.querySelector('.modal-overlay');
    if (oldModal) oldModal.remove();

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
                <div class="modal-box">
                    <h3>✏️ 修改节目</h3>
                    <div class="form-group">
                        <label>节目名称</label>
                        <input type="text" id="editProgramName" value="${name}">
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="editProgramDate" value="${date}">
                    </div>
                    <div class="form-group">
                        <label>时间段</label>
                        <input type="text" id="editProgramTime" value="${timeSlot}">
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="editProgramContent">${content}</textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="btn btn-primary" onclick="saveEditProgram(${id})">保存修改</button>
                    </div>
                </div>
            `;
    document.body.appendChild(modal);

    modal.addEventListener('click', function(e) {
      if (e.target === this) this.remove();
    });
  }

  function saveEditProgram(id) {
    const programName = document.getElementById('editProgramName').value;
    const date = document.getElementById('editProgramDate').value;
    const timeSlot = document.getElementById('editProgramTime').value;
    const content = document.getElementById('editProgramContent').value;

    if (!programName || !date || !timeSlot) {
      showToast('请填写完整信息', 'error');
      return;
    }

    fetch(API_BASE + '/program/update', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: id,
        programName: programName,
        date: date,
        timeSlot: timeSlot,
        content: content
      })
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '修改成功', data.code === 200 ? 'success' : 'error');
              if (data.code === 200) {
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
                loadPrograms();
              }
            })
            .catch(err => {
              showToast('请求失败', 'error');
              console.error(err);
            });
  }

  function deleteProgram(id) {
    if (!confirm('确认删除该节目单吗？')) return;
    fetch(API_BASE + '/program/delete/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '删除成功', 'success');
              if (data.code === 200) loadPrograms();
            })
            .catch(err => { showToast('请求失败', 'error');
              console.error(err); });
  }

  // ==================== 5. 留言管理 ====================
  function loadMessages() {
    document.getElementById('contentArea').innerHTML = `
                <h2>💬 留言管理</h2>
                <div class="search-box">
                    <input type="text" id="searchMessageContent" placeholder="搜索留言内容">
                    <button class="btn btn-primary" onclick="searchMessages()">🔍 搜索</button>
                    <button class="btn btn-primary" onclick="loadMessages()">🔄 刷新</button>
                </div>
                <div id="messageTable">加载中...</div>
            `;

    fetch(API_BASE + '/message/list')
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderMessageTable(data.data || []);
              }
            })
            .catch(err => {
              document.getElementById('messageTable').innerHTML = '<p style="color:red;">请求失败</p>';
              console.error(err);
            });
  }
  function renderMessageTable(messages) {
    if (!messages || messages.length === 0) {
      document.getElementById('messageTable').innerHTML = '<p style="color:#999;">暂无留言</p>';
      return;
    }
    let html = `<p style="color:#999;">共 ${messages.length} 条留言</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>留言内容</th>
                                    <th>回复</th>
                                    <th>留言时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>`;
    messages.forEach(m => {
      html += `
                    <tr>
                        <td>${m.id}</td>
                        <td>${m.content}</td>
                        <td>${m.reply || '未回复'}</td>
                        <td>${m.create_time || m.createTime}</td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="replyMessage(${m.id})">回复</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMessage(${m.id})">删除</button>
                        </td>
                    </tr>
                `;
    });
    html += `</tbody></table>`;
    document.getElementById('messageTable').innerHTML = html;
  }

  function searchMessages() {
    const content = document.getElementById('searchMessageContent').value;
    if (!content) {
      loadMessages();
      return;
    }
    fetch(API_BASE + '/message/search?content=' + encodeURIComponent(content))
            .then(res => res.json())
            .then(data => {
              if (data.code === 200) {
                renderMessageTable(data.data || []);
              }
            })
            .catch(err => {
              document.getElementById('messageTable').innerHTML = '<p style="color:red;">搜索失败</p>';
              console.error(err);
            });
  }

  function replyMessage(id) {
    const reply = prompt('请输入回复内容：');
    if (reply === null) return;
    if (!reply.trim()) { showToast('回复内容不能为空', 'error'); return; }

    const userStr = localStorage.getItem('currentUser');
    if (!userStr) {
      showToast('请先登录', 'error');
      return;
    }
    const user = JSON.parse(userStr);

    fetch(API_BASE + '/message/reply/' + id + '?reply=' + encodeURIComponent(reply) + '&userId=' + user.id, {
      method: 'PUT'
    })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '回复成功', 'success');
              if (data.code === 200) loadMessages();
            })
            .catch(err => { showToast('请求失败', 'error');
              console.error(err); });
  }

  function deleteMessage(id) {
    if (!confirm('确认删除该留言吗？')) return;
    fetch(API_BASE + '/message/delete/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
              showToast(data.msg || '删除成功', 'success');
              if (data.code === 200) loadMessages();
            })
            .catch(err => { showToast('请求失败', 'error');
              console.error(err); });
  }
</script>
</body>
</html>
