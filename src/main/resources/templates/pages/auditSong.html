<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>点歌审核 - 更新点歌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 4px; }
        .card { background: white; border-radius: 8px; padding: 30px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #667eea; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 10px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-primary { background: #667eea; color: white; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #667eea; text-decoration: none; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="header">
    <div>✏️ 点歌审核（auditSong.html）</div>
    <div>
        <a href="allSong.html">📋 返回列表</a>
        <a href="../index.html" style="margin-left:10px;">🏠 首页</a>
    </div>
</div>
<div class="card">
    <div class="card-title">📝 审核点歌申请</div>
    <div class="info-box">
        <p><strong>申请ID：</strong>#1</p>
        <p><strong>申请人：</strong>张三（学号：2024001）</p>
        <p><strong>申请时间：</strong>2026-06-27 10:00:00</p>
    </div>
    <div class="form-group">
        <label>🎵 歌曲名称</label>
        <input type="text" value="夜曲" readonly>
    </div>
    <div class="form-group">
        <label>🎤 歌手</label>
        <input type="text" value="周杰伦" readonly>
    </div>
    <div class="form-group">
        <label>💬 点歌留言</label>
        <textarea readonly>送给全体同学，祝大家学业进步！</textarea>
    </div>
    <div class="form-group">
        <label>📌 审核状态</label>
        <select>
            <option value="pending">待审核</option>
            <option value="approved" selected>✅ 通过</option>
            <option value="rejected">❌ 拒绝</option>
        </select>
    </div>
    <div class="form-group">
        <label>📝 审核备注</label>
        <textarea placeholder="请输入审核意见..."></textarea>
    </div>
    <div class="btn-group">
        <button class="btn btn-success" onclick="alert('审核通过！')">✅ 通过</button>
        <button class="btn btn-danger" onclick="alert('已拒绝！')">❌ 拒绝</button>
        <button class="btn btn-primary" onclick="alert('已保存！')">💾 保存</button>
    </div>
    <a href="allSong.html" class="back-btn">← 返回点歌列表</a>
</div>
</body>
</html>
